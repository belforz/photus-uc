services:
  app-web:
    build: .
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photus}
      POSTGRES_USER: ${POSTGRES_USER:-photus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photus}
    ports:
      - "5432:5432"
    volumes:
      - photus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photus} -d ${POSTGRES_DB:-photus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  photus_db_data:
